version: '3.8'

services:
  # Base de datos PostgreSQL local para desarrollo
  postgres_dev:
    image: postgres:16-alpine
    container_name: modulo_automatizaciones_db_dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: n8n_dev
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: _@2026
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Service de Backend Node.js con Hot-Reload (nodemon)
  backend_dev:
    image: node:22-alpine
    container_name: modulo_automatizaciones_backend_dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    # Las credenciales de SAP viven en backend/.env, que está en .gitignore, y
    # NO se escriben aquí: este archivo sí se versiona. `required: false` deja
    # que el entorno arranque igual si alguien todavía no ha creado su .env —
    # entonces solo se degradan las funciones que hablan con SAP.
    #
    # El bloque `environment` de abajo tiene precedencia sobre env_file, así que
    # DB_HOST sigue siendo postgres_dev aunque el .env diga localhost.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: 3001
      NODE_ENV: development
      DB_HOST: postgres_dev
      DB_PORT: 5432
      DB_NAME: n8n_dev
      DB_USER: n8n
      DB_PASSWORD: _@2026
      JWT_SECRET: secreto_desarrollo_local_123
      JWT_EXPIRES_IN: 8h
      COOKIE_NAME: modulo_reportes_token
      CSRF_COOKIE_NAME: modulo_reportes_csrf
      COOKIE_SECURE: "false"
      FRONTEND_ORIGINS: http://localhost:5173,http://localhost:3001,http://127.0.0.1:5173
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npm install && npx nodemon -L src/server.js"
    depends_on:
      postgres_dev:
        condition: service_healthy

  # Service de Frontend React + Vite con Hot-Reload
  frontend_dev:
    image: node:22-alpine
    container_name: modulo_automatizaciones_frontend_dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_TARGET: http://backend_dev:3001
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --config vite.config.dev.js"
    depends_on:
      - backend_dev

volumes:
  postgres_dev_data:
